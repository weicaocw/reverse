name: CI

# 何时触发:每次 push,以及每个针对仓库的 Pull Request。
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest # 在一台干净的 Linux 机器上跑
    steps:
      # 1. 把仓库代码拉到这台机器上
      - uses: actions/checkout@v4
      # 2. 安装稳定版 Rust 工具链(含 rustfmt 与 clippy 组件)
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # 3. 格式检查:代码不符合 rustfmt 规范就报红(--check 只检查、不改文件)
      - run: cargo fmt --all -- --check
      # 4. 编译(--verbose 让日志更详细,出错好定位)
      - run: cargo build --verbose
      # 5. 跑全部测试;任何一个失败,整个 CI 就变红
      - run: cargo test --verbose
      # 6. clippy 静态检查:把所有 lint 警告当成错误(-D warnings),一条警告都不放过
      - run: cargo clippy --all-targets -- -D warnings

  # 发布作业:产出优化过的 release 可执行文件,并作为构建产物上传。
  # needs: test —— 只有 test 作业全绿才会跑,保证发布的一定是通过测试的版本。
  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # release 构建:开启优化(-O)、去掉 debug 断言,产物更小更快。
      - run: cargo build --release --verbose
      # 把编译出的二进制作为可下载的构建产物上传(保留 7 天)。
      - uses: actions/upload-artifact@v4
        with:
          name: revx-linux-x86_64
          path: target/release/reverse
          retention-days: 7
